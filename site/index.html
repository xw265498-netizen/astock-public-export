<style>
  :root{
    --bg:#000; --panel:#1c1c1e; --panel2:#2c2c2e; --line:#2c2c2e;
    --text:#f2f2f7; --sub:#8e8e93; --accent:#0a84ff; --ok:#30d158; --bad:#ff453a;
    --bubble-in:#26262a; --bubble-out:#0a84ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overscroll-behavior:none}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:var(--panel2);color:var(--text);padding:10px 14px}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;border:1px solid var(--line)}
  button.sm{padding:7px 11px;font-size:13px;border-radius:8px}
  input,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;width:100%}
  input:focus,textarea:focus{border-color:#3a3a3c}
  .hide{display:none!important}
  .err{color:var(--bad);font-size:13px;margin-top:10px;white-space:pre-wrap}
  .empty{color:var(--sub);font-size:13px;padding:12px 4px}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(120% 90% at 50% 18%,#12304f 0%,#0a1828 42%,#03060a 100%)}
  #login .card{width:100%;max-width:360px;background:rgba(18,23,34,.82);border:1px solid rgba(212,175,105,.22);border-radius:22px;padding:26px 22px;backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
  #login .brandLogo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 14px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
  #login h1{margin:0 0 6px;font-size:24px;text-align:center;letter-spacing:3px;font-weight:700}
  #login p{color:var(--sub);font-size:13px;margin:0 0 20px;text-align:center}
  #login label{display:block;font-size:12.5px;color:var(--sub);margin:14px 0 6px}
  #login input{background:rgba(8,12,18,.8);border-color:rgba(148,163,184,.22);border-radius:12px}
  #login button{margin-top:20px;background:var(--accent);color:#fff;font-weight:600;border-radius:12px}

  #app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto;position:relative;background:var(--bg)}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #1c1c1e;
    position:sticky;top:0;background:rgba(10,10,11,.82);backdrop-filter:blur(20px) saturate(160%);z-index:5;min-height:48px}
  #menuBtn{background:transparent;padding:6px 8px;font-size:18px;line-height:1;color:var(--accent)}
  #sessTitle{font-size:17px;font-weight:600;flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:.2px}
  #stat{font-size:11.5px;color:var(--sub)}

  #quoteBar{display:none;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #1c1c1e;background:#0a0a0b;font-size:12px;color:#8e8e93;cursor:pointer}
  #quoteBar.show{display:flex}
  #quoteBar .qdot{width:6px;height:6px;border-radius:50%;background:#30d158;flex:0 0 6px}
  #quoteBar .qdot.stale{background:#ff9f0a}
  #quoteBar .qdot.bad{background:#ff453a}
  #quoteBar .qnm{color:#f2f2f7;font-weight:600;max-width:38vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #quoteBar .qpx{font-variant-numeric:tabular-nums;font-weight:600}
  #quoteBar .qchg{font-variant-numeric:tabular-nums}
  #quoteBar .qchg.up{color:#ff453a}.qchg.down{color:#30d158}
  #quoteBar .qtm{margin-left:auto;font-size:11px;color:#8e8e93;white-space:nowrap}
  #quoteBar .qx{background:transparent;border:0;color:#636366;font-size:14px;padding:0 2px}

  #msgs{flex:1;overflow-y:auto;padding:14px 12px 96px;display:flex;flex-direction:column;gap:5px;-webkit-overflow-scrolling:touch;background:#000}
  .msg{max-width:74%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-break:break-word;position:relative;font-size:15.2px;line-height:1.44}
  .msg.user{align-self:flex-end;background:var(--bubble-out);color:#fff;margin-top:8px}
  .msg.assistant{align-self:flex-start;background:var(--bubble-in);color:#f2f2f7;margin-top:8px}
  .msg.sys{align-self:center;background:transparent;color:var(--sub);font-size:12px;padding:2px 6px;max-width:92%;margin-top:6px}
  .msg.assistant + .msg.assistant,.msg.user + .msg.user{margin-top:2px}
  .msg.key{align-self:stretch;max-width:100%;margin-top:10px;background:linear-gradient(155deg,#10243a 0%,#0b1522 100%);border:1px solid #23415f;border-radius:16px;padding:11px 13px;color:#eaf2fb}
  .msg.key .kh{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:#8fc4ff;letter-spacing:.5px}
  .msg.key .kh .fold{background:transparent;border:0;color:#8fc4ff;font-size:11px;padding:0 2px}
  .msg.key .kb{margin-top:6px;font-size:13.2px;line-height:1.62;color:#dbe8f6;white-space:pre-wrap}
  .msg.key.collapsed .kb{display:none}
  .msg.key .kb b{color:#fff}
  .ansBlock{align-self:stretch;max-width:100%;background:transparent!important;padding:0!important;display:flex;flex-direction:column;gap:6px}
  .ansBlock .keyCard{background:linear-gradient(155deg,#10243a 0%,#0b1522 100%);border:1px solid #23415f;border-radius:16px;padding:11px 13px;color:#eaf2fb}
  .ansBlock .keyCard .kh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#8fc4ff;letter-spacing:.5px}
  .ansBlock .keyCard .kh .spk{float:none;margin:0 0 0 auto;font-size:12px}
  .ansBlock .keyCard .kb{margin-top:6px;font-size:13.6px;line-height:1.66;color:#dbe8f6;white-space:pre-wrap}
  .detailToggle{align-self:center;background:transparent;border:0;color:#64a8ff;font-size:11.5px;padding:6px 14px;margin:0 0 4px;letter-spacing:.2px;border-radius:9px;cursor:pointer}
  .detailToggle:active{background:rgba(10,132,255,.12)}
  #quoteBar .qdot.closed{background:#8e8e93}
  .detailWrap{display:none;background:var(--bubble-in);border-radius:16px;padding:10px 13px;white-space:pre-wrap;word-break:break-word;font-size:14.2px;line-height:1.58;color:#d1d1d6;max-height:54vh;overflow:auto}
  .spk{float:right;margin:-3px -6px 0 8px;background:transparent;padding:2px 3px;color:var(--sub);font-size:12px;opacity:.7}
  .spk.on{color:var(--accent);opacity:1}

  .think{align-self:flex-start;max-width:74%;margin-top:8px;padding:7px 11px;border-radius:14px;background:rgba(28,28,30,.82);border:1px solid #2a2a2d;color:#8e8e93;font-size:12px;line-height:1.5;overflow:hidden;transition:opacity .25s ease,transform .25s ease}
  .think.out{opacity:0;transform:translateY(-4px)}
  .think .th{display:flex;align-items:center;gap:6px;color:#aeaeb2;font-size:11.5px;margin-bottom:2px}
  .think .pulse{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(10,132,255,.45);animation:tpulse 1.4s infinite}
  @keyframes tpulse{0%{box-shadow:0 0 0 0 rgba(10,132,255,.45)}70%{box-shadow:0 0 0 6px rgba(10,132,255,0)}100%{box-shadow:0 0 0 0 rgba(10,132,255,0)}}
  .think .tbody{max-height:54px;overflow:hidden;word-break:break-word;color:#8e8e93}

  footer{padding:8px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #1c1c1e;
    display:flex;gap:7px;align-items:flex-end;background:rgba(10,10,11,.9);backdrop-filter:blur(20px) saturate(160%)}
  #inp{flex:1;resize:none;max-height:120px;min-height:36px;padding:8px 14px;line-height:1.4;background:#1c1c1e;border:1px solid #2c2c2e;border-radius:18px;font-size:15px}
  #mic,#send{flex:0 0 34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
  #mic{background:transparent;font-size:18px;color:var(--sub)}
  #mic.live{background:#3a0d12;color:var(--bad);animation:pulse 1.4s infinite}
  #send{background:var(--accent);color:#fff;font-weight:600;font-size:19px;line-height:1;transition:background .15s,transform .15s}
  #send:active:not(:disabled){transform:scale(.94)}
  #send.busy{background:var(--bad);font-size:15px}
  #send.readonly{background:#2c2c2e;color:#8e8e93;font-size:13px}
  @keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}

  #callBar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;z-index:9;pointer-events:none}
  #callBar .inner{background:#111821;border:1px solid #2a3546;border-radius:999px;padding:10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.55);pointer-events:auto}
  .wave{display:flex;gap:3px;align-items:center;height:20px}
  .wave i{width:3px;height:10px;background:var(--accent);border-radius:2px;animation:wave 1s infinite}
  .wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}
  .wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
  @keyframes wave{0%,100%{height:8px}50%{height:18px}}
  #hangUp{background:#7a1f2b;padding:8px 16px;border-radius:999px;font-size:13px}

  #mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,340px);background:#11161d;border-right:1px solid var(--line);
    z-index:21;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  #drawer.open{transform:none}
  #drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:14px}
  #drawer .dh b{font-size:14px}
  .sessList{overflow:auto;flex:1;padding:4px 8px}
  .item{display:flex;align-items:center;gap:8px;padding:10px;border-radius:9px;font-size:13.5px;color:var(--sub)}
  .item .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .item.on{background:var(--panel2);color:var(--text)}
  .item .del{color:#7d8899;font-size:12px;padding:2px 6px;background:transparent}
  #drawer .foot{border-top:1px solid var(--line);padding:10px 12px 10px;display:flex;gap:8px}
  .tool{margin:6px 12px 14px;border:1px solid var(--line);border-radius:12px;padding:12px}
  .tool h3{margin:0 0 8px;font-size:12.5px;color:var(--sub);font-weight:600}
  .row{display:flex;gap:8px}
  .qbox{margin-top:10px;font-size:13px}
  .lbl{color:var(--sub);font-size:12px}
  .up{color:#e5534b}.down{color:#2ea043}

  #bell{background:transparent;padding:6px 8px;font-size:17px;line-height:1;position:relative}
  #bell .dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#e5534b}
  .msg.brief{align-self:stretch;max-width:100%;background:linear-gradient(160deg,#18202e,#141a24);border:1px solid #2b416d;border-radius:14px;padding:12px 14px}
  .msg.brief h4{margin:0 0 7px;font-size:12.5px;color:#9db4ff;font-weight:600;display:flex;justify-content:space-between;gap:10px}
  .msg.brief .bd{font-size:14px;line-height:1.68;white-space:pre-wrap}
  .msg.brief .act{display:flex;gap:8px;margin-top:9px}
</style>
</head>

<div id="login">
  <div class="card">

    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" class="hide">

  <div id="callBar" class="hide">
    <div class="inner">
      <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <span id="callTip" style="font-size:13px;color:var(--sub)">在听你说</span>
      <button id="hangUp">挂断</button>
    </div>
  </div>
</div>

<div id="mask"></div>
<div id="drawer">
  <div class="dh"><b>会话</b><button class="ghost sm" id="newSess">新对话</button></div>
  <div class="sessList" id="sessList"></div>
  <div class="tool">

      <button class="ghost sm" id="toCtx">带进对话</button>

    <div class="row" style="margin-top:8px"><input id="bulk" placeholder="批量加自选：代码用逗号或空格隔开" /><button class="sm" id="bulkAdd" style="flex:0 0 46px">加</button></div>
    <div id="watchBox" style="margin-top:8px"></div>
  </div>
  <div class="tool">
    <h3>智能分析（自建服务）</h3>
    <div class="row"><input id="acode" placeholder="600519" /><input id="acash" placeholder="本金" style="flex:0 0 76px" value="100000" /><button class="sm" id="abtn" style="flex:0 0 46px">算</button></div>
    <div class="qbox" id="abox"></div>
    <div class="row" style="margin-top:8px">
      <button class="ghost sm" id="aCtx">带进对话</button>
    </div>
  </div>
  <div class="tool">
    <h3>持仓（填了就能算浮动盈亏）</h3>
    <div class="row"><input id="pcode" placeholder="代码" /><input id="pcost" placeholder="成本价" style="flex:0 0 74px" /><input id="pqty" placeholder="股数" style="flex:0 0 70px" /></div>
    <div class="row" style="margin-top:7px"><button class="ghost sm" id="addPos">加一笔</button><button class="ghost sm" id="posRefresh">刷新盈亏</button></div>
    <div id="posBox" style="margin-top:8px"></div>
  </div>
  <div class="foot"><button class="ghost sm" id="logout" style="width:100%">退出登录</button></div>
</div>

function createScopedRdbClient(){
  async function execute(request){
    if(!request.operation) return {data:null,error:{message:'未指定数据库操作'}};
    const result = await callFn({ action:'rdb.query', query:request });
    if(!result || !result.ok) return {data:null,error:{message:(result&&result.error)||'数据库请求失败'}};
    return {data:result.data==null?null:result.data,error:null};
  }
  return {
    from(table){
      const request={table,filters:[]};
      const builder={
        select(columns='*'){
          if(request.operation && request.operation!=='select') request.returning=true;
          else request.operation='select';
          request.columns=columns;
          return this;
        },
        insert(data){ request.operation='insert'; request.data=data; return this; },
        update(data){ request.operation='update'; request.data=data; return this; },
        delete(){ request.operation='delete'; return this; },
        eq(column,value){ request.filters.push({op:'eq',column,value}); return this; },
        gte(column,value){ request.filters.push({op:'gte',column,value}); return this; },
        order(column,options={}){
          request.order={column,ascending:!options||options.ascending!==false};
          return this;
        },
        limit(value){ request.limit=value; return this; },
        then(resolve,reject){ return execute(request).then(resolve,reject); }
      };
      return builder;
    }
  };
}

async function pickToken(){
  const tries=[];
  try{ tries.push(['getSession', await auth.getSession()]); }catch(e){}
  try{ tries.push(['getAccessToken', await auth.getAccessToken()]); }catch(e){}
  try{ tries.push(['getUser', await auth.getUser()]); }catch(e){}
  const dig=(o)=> o && (o.access_token || (o.session&&o.session.access_token) || (o.data&&(o.data.access_token||(o.data.session&&o.data.session.access_token))));
  for(const [,r] of tries){ const t=dig(r); if(t) return t; }
  return localStorage.getItem('CB_AUTH_TOKEN') || null;
}

window.prepareIamSession = async ()=>{

};

window.signInForIam = async (username, password)=>{
  initSDK();
  const result = await auth.signInWithPassword({ username, password });
  if(result && result.error) throw new Error(result.error.message || JSON.stringify(result.error));
  token = await pickToken();

  try{ localStorage.setItem('CB_AUTH_TOKEN', token); }catch(e){}
};

// 真实改密：用目标账号自己的旧密码换发 sudo_token，再改密码；不影响当前登录会话
window.changeCloudPwd = async (username, oldPwd, newPwd)=>{
  const origin = 'https://' + ENV + '.api.tcloudbasegateway.com';
  const req = async (path, method, body, tk) => {
    const r = await fetch(origin + path, {
      method,
      headers: { 'Content-Type': 'application/json', ...(tk ? { Authorization: 'Bearer ' + tk } : {}) },
      body: JSON.stringify(body),
    });
    const text = await r.text();
    let data = {};
    try { data = JSON.parse(text); } catch (e) {}
    if (!r.ok) {
      const msg = data.error_description || data.message || data.error || data.code || text.slice(0, 160) || ('HTTP ' + r.status);
      throw new Error(msg);
    }
    return data;
  };
  const u = String(username || '').trim();
  if (!u) throw new Error('缺少用户名');
  if (!oldPwd || !newPwd) throw new Error('旧密码和新密码都要填');
  const s = await req('/auth/v1/signin', 'POST', { username: u, password: oldPwd });
  if (!s.access_token) throw new Error('旧密码校验失败');
  const sd = await req('/auth/v1/user/sudo', 'POST', { password: oldPwd }, s.access_token);
  if (!sd.sudo_token) throw new Error('旧密码校验失败');
  await req('/auth/v1/user/password', 'PATCH', { new_password: newPwd, sudo_token: sd.sudo_token }, s.access_token);
  return { ok: true };
};

function splitKeyAnswer(text){
  const marker='【关键回答】';
  const raw=String(text||'');
  const i=raw.indexOf(marker);
  if(i<0) return { main:raw, key:'' };
  return { main:raw.slice(0,i).trim(), key:raw.slice(i+marker.length).trim() };
}
function cleanDetail(t){

    .replace(/(^|\n)\s*[A-E]\s*[.、:：]\s*(?=\S)/g,'$1')
    .replace(/\n{3,}/g,'\n\n')

function addBubble(kind,text,muted){

  if(kind==='assistant' && tailKey) return addAnswerBlock(text,tailKey,muted);
  const d=document.createElement('div'); d.className='msg '+kind;
  const sp=document.createElement('span'); sp.textContent=text; d.appendChild(sp);
  if(kind==='assistant' && !muted){
    const b=document.createElement('button'); b.className='spk'; b.textContent='🔊'; b.title='朗读';
    b.onclick=()=>{ if(b.classList.contains('on')) stopSpeak(); else speak(text, b); }; d.appendChild(b);
  }
  $('#msgs').appendChild(d); scrollBottom();
  return d;

// 实时行情跟踪条：当前对话出现股票代码就跟踪，15 秒刷新，休市 60 秒
let trackedCode=null, trackedQuote=null, quoteTimer=null;
function stopQuoteTracking(){
  trackedCode=null; trackedQuote=null; clearTimeout(quoteTimer); quoteTimer=null;
  const b=$('#quoteBar'); if(b){ b.className=''; b.innerHTML=''; }
}
function renderQuoteBar(q,err){
  const b=$('#quoteBar'); if(!b) return;
  if(!trackedCode){ b.className=''; b.innerHTML=''; return; }
  if(!q){
    b.className='show';
    b.innerHTML='<span class="qdot bad"></span><span class="qnm">'+esc(trackedCode)+'</span><span>行情连接失败，点此重试</span><span class="qtm">↻</span>';
    b.onclick=()=>trackQuote(trackedCode);
    return;
  }
  const up=(q.chgPct||0)>0, down=(q.chgPct||0)<0;
  const mt=q.marketTime||'';
  const today=new Date(Date.now()+8*3600000).toISOString().slice(0,10);
  const tm=mt? (mt.slice(0,10)===today?mt.slice(11,19):mt.slice(5,16)) : '时间未知';
  let state='实时', dot='';
  if(q.stale){
    const same=mt.slice(0,10)===today;
    const hm=same?Number(mt.slice(11,13))*60+Number(mt.slice(14,16)):0;
    if(same && hm>=900){ state='已收盘'; dot='closed'; }
    else if(same && hm<570){ state='盘前'; dot='closed'; }
    else { state='延迟'; dot='stale'; }
  }
  const sig=up?'+':'';
  b.className='show';
  b.innerHTML='<span class="qdot '+dot+'"></span>'+
    '<span class="qnm">'+esc(q.name||'')+' '+esc(q.code||trackedCode)+'</span>'+
    '<span class="qpx">'+esc(String(q.price))+'</span>'+
    '<span class="qchg '+(up?'up':down?'down':'')+'">'+sig+esc(String(q.chgPct==null?'--':q.chgPct))+'%</span>'+
    '<span class="qtm">'+esc(tm)+' · '+state+'</span>'+
    '<button class="qx" title="关闭行情跟踪">×</button>';
  b.onclick=(e)=>{ if(e.target && e.target.classList && e.target.classList.contains('qx')){ stopQuoteTracking(); } else { trackQuote(trackedCode); } };
}
async function trackQuote(code,silent){
  code=String(code||'').trim();
  if(!/^\d{6}$/.test(code)) return null;
  trackedCode=code;
  if(!silent){
    const b=$('#quoteBar');
    if(b){ b.className='show'; b.innerHTML='<span class="qdot stale"></span><span class="qnm">'+esc(code)+'</span><span>行情加载中…</span><span class="qtm">↻</span>'; }
  }
  try{
    const q=await callFn({action:'quote',code});
    if(!q || !q.price) throw new Error((q&&q.error)||'没有价格');
    trackedQuote=q; renderQuoteBar(q);
    return q;
  }catch(e){
    trackedQuote=null;
    if(!silent) renderQuoteBar(null,e);
    return null;
  }finally{
    clearTimeout(quoteTimer);
    quoteTimer=setTimeout(()=>{
      if(trackedCode && !document.hidden) trackQuote(trackedCode,true);
    }, (trackedQuote&&trackedQuote.stale)?60000:15000);
  }
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && trackedCode) trackQuote(trackedCode,true); });

let thinkEl=null, thinkBody=null, thinkLabel=null, thinkRaw='', thinkStart=0, thinkTimer=null;

  endThink(true);

  const head=document.createElement('div'); head.className='th';
  const dot=document.createElement('span'); dot.className='pulse';

  thinkBody=document.createElement('div'); thinkBody.className='tbody';
  thinkEl.appendChild(head); thinkEl.appendChild(thinkBody);
  $('#msgs').appendChild(thinkEl);
  thinkRaw=''; thinkStart=Date.now();
  setThinkText(line||'');
  clearInterval(thinkTimer);
  thinkTimer=setInterval(()=>{
    if(!thinkLabel) return;
    const sec=Math.round((Date.now()-thinkStart)/1000);
    thinkLabel.textContent=(label||'正在思考')+(sec>=2?' · '+sec+'s':'');
  },1000);
  return thinkEl;
}
function setThinkText(t){
  if(!thinkBody) return;
  t=String(t||'').slice(-180);
  thinkBody.textContent=t;
  thinkBody.scrollTop=thinkBody.scrollHeight;
  scrollBottom();
  setTimeout(scrollBottom,220);

function appendThink(line){
  if(!thinkBody) return;
  const prev=thinkBody.textContent||'';
  setThinkText(prev+(prev?'\n':'')+line);
}
function zhThought(s){
  return String(s||'')
    .replace(/```[\s\S]*?```/g,'')
    .replace(/[^\u3400-\u9FFF\u3000-\u303F\uFF00-\uFFEF0-9.%+\-\n]/g,'')
    .replace(/[ \t]+/g,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
function endThink(immediate){
  clearInterval(thinkTimer); thinkTimer=null;
  const el=thinkEl; thinkEl=null; thinkBody=null; thinkLabel=null; thinkRaw='';
  if(!el) return;
  if(immediate){ el.remove(); return; }
  el.classList.add('out');
  setTimeout(()=>{ try{ el.remove(); }catch(e){} },260);
}

    }

    ph = addBubble('assistant','');

      signal: abortCtrl.signal,
      body: JSON.stringify({ model:MODEL, reasoning_effort:wantThink?'low':'none', stream:true, messages:ctx }) });
    if(!r.ok){ const j=await r.json().catch(()=>({})); ph.remove(); throw new Error(j.message||('HTTP '+r.status)); }
    const KEY_MARK='【关键回答】';
    let full='', mainAns='', keyAns='', keyStarted=false, gotMain=false, spokenUpTo=0;
    if(r.body && r.body.getReader){
      const rd=r.body.getReader(); const dec=new TextDecoder(); let buf='';
      while(true){
        const {done,value}=await rd.read(); if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop()||'';
        for(const ln of lines){
          const s=ln.trim(); if(!s.startsWith('data:')) continue;
          const d=s.slice(5).trim(); if(d==='[DONE]') continue;

            const t=dl.content||(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
            if(t){

              if(mainAns && !gotMain){ gotMain=true; endThink(); }
              span.textContent=mainAns||(keyStarted?'关键回答已生成，见下方卡片':'');
              scrollBottom();
              if(callOn && mainAns){ const pend=mainAns.slice(spokenUpTo); if(pend.length>=8 && /[。！？!?]\s*$/.test(pend)){ enqueueTTS(pend,null); spokenUpTo=mainAns.length; } }
            }
          }catch(e){}
        }
      }
    }else{
      const j=await r.json(); full=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
      const mi=full.indexOf(KEY_MARK);
      if(mi>=0){ keyStarted=true; mainAns=full.slice(0,mi).trim(); keyAns=full.slice(mi+KEY_MARK.length); }
      else mainAns=full;
      endThink(); span.textContent=mainAns;
    }
    if(!mainAns && keyStarted) ph.remove();
    if(callOn && mainAns && spokenUpTo<mainAns.length){ enqueueTTS(mainAns.slice(spokenUpTo),null); spokenUpTo=mainAns.length; }
    if(!mainAns && !keyAns){ endThink(); ph.remove(); throw new Error('模型没有返回内容'); }
    if(keyAns){
      if(ph.parentNode) ph.remove();
      addAnswerBlock(mainAns,keyAns);
    }else if(mainAns){
      const spk=document.createElement('button'); spk.className='spk'; spk.textContent='🔊'; spk.title='朗读'; spk.onclick=()=>{ if(spk.classList.contains('on')) stopSpeak(); else speak(mainAns,spk); }; ph.appendChild(spk);
    }

    await db.from('messages').insert({ session_id:curSess.id, role:'assistant', content:stored });
    return mainAns||keyAns;
  }catch(e){
    endThink();
    if(e && e.name === 'AbortError'){
      if(span && /正在/.test(span.textContent)) span.textContent = '已停止';
      addBubble('sys','已停止生成');
      return null;
    }
    addBubble('sys','出错：'+(e.message||e));

  }finally{
    endThink();
    busy=false; abortCtrl=null;

}

async function callFn(body){
  try{
    initSDK();
    const res = await app.callFunction({ name:'stockapi', data: body });
    if(res && res.result) return res.result;
  }catch(e){ /* 回退到 HTTP 网关 */ }
  const r = await fetch(FN_URL,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}, body: JSON.stringify(body) });
  return await r.json().catch(()=>({ok:false,error:'HTTP '+r.status}));
}
function fnErr(j){
  const e = j.error || j.message || '未知错误';
  if(/ServerNotOpen|UserNotRegistered/.test(e)) return '语音服务没开通，去腾讯云控制台开通 ASR / TTS。';
  return e;
}
let speaking=null, ttsQueue=[], ttsRunning=false, ttsBtn=null, ttsAbort=null;
function splitTTS(text){
  const raw=String(text||'').replace(/\s+/g,' ').trim();
  if(!raw) return [];
  const parts=raw.match(/[^。！？!?；;\n]+[。！？!?；;\n]?/g)||[raw];
  const out=[]; let cur='';
  for(const p of parts){
    if((cur+p).length>90 && cur){ out.push(cur); cur=''; }
    cur+=p;
  }
  if(cur) out.push(cur);
  return out;
}
function enqueueTTS(text, btn){
  const chunks=splitTTS(text);
  if(!chunks.length) return;
  if(btn){ ttsBtn=btn; btn.classList.add('on'); }
  ttsQueue.push(...chunks);
  if(!ttsRunning) drainTTS();
}
function speakOne(text){
  return new Promise((resolve)=>{
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='zh-CN'; u.rate=1.05; u.pitch=1;
      const vs=window.speechSynthesis.getVoices()||[];
      const zh=vs.find(v=>/zh|Chinese|Xiaoxiao|Yunxi|Huihui/i.test((v.lang||'')+(v.name||'')));
      if(zh) u.voice=zh;
      u.onend=()=>resolve(); u.onerror=()=>resolve();
      window.speechSynthesis.speak(u);
    }catch(e){ resolve(); }
  });
}
async function drainTTS(){
  ttsRunning=true;
  try{
    while(ttsQueue.length){
      const chunk=ttsQueue.shift();
      speaking=true;
      await speakOne(chunk);
      speaking=null;
      if(ttsAbort && ttsAbort.signal.aborted) break;
    }
  }catch(e){
    ttsQueue=[];
  }finally{
    ttsRunning=false; ttsAbort=null;
    if(ttsBtn){ ttsBtn.classList.remove('on'); ttsBtn=null; }
  }
}
function speak(text, btn){
  stopSpeak();
  try{ ttsAbort=new AbortController(); enqueueTTS(text, btn); }catch(e){ console.warn(e); }
}
function stopSpeak(){
  ttsQueue=[];
  if(ttsAbort){ try{ ttsAbort.abort(); }catch(e){} ttsAbort=null; }
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  speaking=null;
  if(ttsBtn){ ttsBtn.classList.remove('on'); ttsBtn=null; }
}

// 录音 → 16k 单声道 WAV → base64
async function toWav16k(blob){
  const buf = await blob.arrayBuffer();
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const audio = await ac.decodeAudioData(buf);
  const sr=16000, ratio = audio.sampleRate/sr, n = Math.floor(audio.length/ratio);
  const out = new Float32Array(n);
  const chs = [];
  for(let c=0;c<audio.numberOfChannels;c++) chs.push(audio.getChannelData(c));
  for(let i=0;i<n;i++){
    const s=Math.floor(i*ratio), e2=Math.min(audio.length, Math.floor((i+1)*ratio))||s+1;
    let sum=0,cnt=0;
    for(let k=s;k<e2;k++){ let v=0; for(let c=0;c<chs.length;c++) v+=chs[c][k]; sum += v/chs.length; cnt++; }
    out[i]= cnt? sum/cnt : 0;
  }
  ac.close();
  const bytes=n*2, ab=new ArrayBuffer(44+bytes), v=new DataView(ab);
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+bytes,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,bytes,true);
  let off=44; for(let i=0;i<n;i++){ let x=Math.max(-1,Math.min(1,out[i])); v.setInt16(off, x<0?x*0x8000:x*0x7fff, true); off+=2; }
  const u8=new Uint8Array(ab); let str='';
  for(let i=0;i<u8.length;i+=8192) str+=String.fromCharCode.apply(null, u8.subarray(i,i+8192));
  return btoa(str);
}
async function asr(blob){
  const wav = await toWav16k(blob);
  const j = await callFn({ action:'asr', audioBase64:wav, format:'wav' });
  if(!j.ok) throw new Error(fnErr(j));
  return (j.text||'').trim();
}

async function onceRecord(){
  const st = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
  const chunks=[]; const rec=new MediaRecorder(st, {mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':''});
  rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  const started = Date.now();
  const stop = new Promise(res=>{ rec.onstop=()=>res(new Blob(chunks,{type:'audio/webm'})); });
  rec.start();
  return { stop: ()=>{ if(rec.state==='recording') rec.stop(); st.getTracks().forEach(t=>t.stop()); return {blob:stop, ms: Date.now()-started}; } };
}

let callOn=false, callStream=null, callAC=null, callAnalyser=null, callData=null;
const micBtn = $('#mic');

micBtn.onclick = ()=> callOn ? stopCall() : startCall();
$('#hangUp').onclick = ()=> stopCall();

async function startCall(){
  try{
    callStream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){ addBubble('sys','麦克风打不开：'+(e.message||e)); return; }
  callAC = new (window.AudioContext||window.webkitAudioContext)();
  await callAC.resume();
  const src = callAC.createMediaStreamSource(callStream);
  callAnalyser = callAC.createAnalyser(); callAnalyser.fftSize=512;
  src.connect(callAnalyser);
  callData = new Uint8Array(callAnalyser.fftSize);
  callOn = true;
  micBtn.classList.add('live'); micBtn.textContent='■';
  $('#callBar').classList.remove('hide');
  setTip('在听你说');
  if(briefRow && !briefRow._spoke){
    briefRow._spoke=1; setTip('先说今天的情况…');
    try{ speak(briefRow.body, null); }catch(e){}
    setTip('在听你说');
  }
  loop();
}

function stopCall(){
  callOn=false;
  stopSpeak();
  if(callStream) callStream.getTracks().forEach(t=>t.stop());
  if(callAC) try{ callAC.close(); }catch(e){}
  callStream=null; callAC=null; callAnalyser=null;
  micBtn.classList.remove('live'); micBtn.textContent='☎';
  $('#callBar').classList.add('hide');
  setTip('在听你说');
}
function setTip(s){ $('#callTip').textContent = s; }
function rms(){
  if(!callAnalyser) return 0;
  callAnalyser.getByteTimeDomainData(callData);
  let sum=0; for(let i=0;i<callData.length;i++){ const v=(callData[i]-128)/128; sum+=v*v; }
  return Math.sqrt(sum/callData.length);
}
const TH = 0.045;

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function loop(){
  while(callOn){
    // 等开口
    let need=0;
    while(callOn && need<3){ if(rms()>TH) need++; else need=0; await sleep(60); }
    if(!callOn) break;
    if(speaking){ if(rms()>TH*1.5){ stopSpeak(); } await sleep(120); continue; }

    setTip('听你说…');
    const chunks=[]; let rec=null;
    try{
      rec = new MediaRecorder(callStream, {mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':''});
      rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
      rec.start();
    }catch(e){ break; }
    const t0 = Date.now(); let quiet=0;
    while(callOn){
      await sleep(60);
      if(speaking) break;
      if(rms()<TH) quiet++; else quiet=0;
      if(quiet>14) break;                          // 静音约 0.85s
      if(Date.now()-t0 > 20000) break;             // 单段上限 20s
    }
    const blob = await new Promise(res=>{ rec.onstop=()=>res(new Blob(chunks,{type:'audio/webm'})); if(rec.state==='recording') rec.stop(); else res(new Blob(chunks)); });
    if(!callOn) break;
    if(blob.size < 9000) { setTip('在听你说'); continue; }
    setTip('识别中…');
    try{
      const text = await asr(blob);
      if(!text){ setTip('在听你说'); continue; }
      setTip('回答中…');
      const ans = await sendMsg(text);
      if(ans && !ttsRunning) enqueueTTS(ans, null);
      setTip('在听你说');
    }catch(e){
      addBubble('sys','通话出错：'+(e.message||e));
      await sleep(600);
    }
  }
}

  box.querySelectorAll('[data-del]').forEach(a=>a.onclick=async(e)=>{ e.preventDefault(); await db.from('watchlist').delete().eq('id',a.dataset.del); await loadWatch(); });
}

// ---------- 智能分析（云函数 analyze：东财 K 线 + A 股规则 + 回测与校验）----------
let anaQuote=null;
$('#abtn').onclick = async ()=>{
  const box=$('#abox'), code=($('#acode').value||'').trim(), cash=Number($('#acash').value)||100000;
  if(!/^\d{6}$/.test(code)){ box.style.display='block'; box.textContent='代码要 6 位数字'; return; }
  box.style.display='block'; box.textContent='算着…（拉 3 年 K 线）'; $('#abtn').disabled=true;
  try{
    const j = await callFn({ action:'analyze', code, cash:String(cash) });
    if(!j.ok) throw new Error(fnErr(j));
    anaQuote=j;
    const m=j.backtest.metrics, chg=j.last.chg_pct, cls=(chg==null||chg>=0)?'up':'down';
    const rows=[
      '<div><b>'+esc(j.code)+'</b> <span class="lbl">'+esc(j.last.date)+' · '+esc(j.source)+' · '+esc(j.range[0])+'~'+esc(j.range[1])+'（'+j.bars+' 根）</span></div>',
      '<div class="'+cls+'" style="font-size:17px;font-weight:600;margin:3px 0">'+j.last.close+' <span style="font-size:12px">'+(chg==null?'-':(chg>=0?'+':'')+chg.toFixed(2)+'%')+'</span></div>',
      '<div class="lbl">涨跌停 '+j.limits.limit_up+' / '+j.limits.limit_down+'（'+esc(j.board)+' ±'+j.limits.pct+'%）</div>',
      '<div class="lbl">双均线回测：收益 '+m.total_return.toFixed(2)+'%，年化 '+m.annual_return.toFixed(2)+'%，回撤 '+m.max_drawdown.toFixed(1)+'%，夏普 '+m.sharpe+'，成交 '+m.trades+' 笔，被拦 '+m.blocked+'</div>',
      '<div class="lbl">数据校验 P0 '+j.summary.P0+' / P1 '+j.summary.P1+' / P2 '+j.summary.P2+'</div>'
    ];
    const reasons=j.backtest.blocked_reasons||{};
    if(Object.keys(reasons).length){
      rows.push('<div class="lbl">被拦：'+Object.entries(reasons).map(([k,v])=>esc(k)+'×'+v).join('；')+'</div>');
    }
    if(j.issues && j.issues.length) rows.push('<div class="lbl">'+esc(j.issues[0].detail)+'</div>');
    box.innerHTML=rows.join('');
  }catch(e){ box.textContent='分析失败：'+(e.message||e); anaQuote=null; }
  finally{ $('#abtn').disabled=false; }
};
$('#aCtx').onclick=()=>{
  if(!anaQuote){ alert('先算一个'); return; }
  const a=anaQuote, m=a.backtest.metrics, chg=a.last.chg_pct;
  closeDrawer();
  $('#inp').value='看下 '+a.code+'：截至 '+a.last.date+' 收盘 '+a.last.close+' 元'+
    (chg==null? '' : '、当日 '+(chg>=0?'+':'')+chg.toFixed(2)+'%')+
    '，涨跌停 '+a.limits.limit_up+'/'+a.limits.limit_down+
    '。我这边跑的双均线回测：总收益 '+m.total_return.toFixed(2)+'%、最大回撤 '+m.max_drawdown.toFixed(1)+'%、成交 '+m.trades+' 笔。这数据靠谱吗，值不值得盯？';
  $('#inp').focus();
};

// ---------- 持仓 ----------
async function loadPositions(){
  return ((await db.from('positions').select('*').order('created_at',{ascending:false})).data)||[];
}
async function renderPositions(){
  const box=$('#posBox'); box.textContent='刷新中…';
  const pos=await loadPositions();
  if(!pos.length){ box.innerHTML='<div class="empty">还没录持仓</div>'; return; }
  const lines=[]; let total=0;
  for(const p of pos.slice(0,8)){
    let price=null,chg=null;
    try{ const q=await emQuote(p.code); price=q.price; chg=q.chgPct; }catch(e){}
    const qty=Number(p.qty)||0, cost=Number(p.avg_cost)||0;
    let pnlTxt='-', cls='lbl';
    if(price!=null && cost>0 && qty>0){
      const pnl=(price-cost)*qty, rate=(price/cost-1)*100; total+=pnl;
      cls = pnl>=0?'up':'down';
      pnlTxt=(pnl>=0?'+':'')+pnl.toFixed(0)+' / '+(rate>=0?'+':'')+rate.toFixed(1)+'%';
    }
    lines.push('<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:12.5px">'+
      '<span>'+esc(p.name||p.code)+' <span class="lbl">'+esc(p.code)+'</span></span>'+
      '<span class="'+cls+'">'+pnlTxt+'<a href="#" data-pdel="'+p.id+'" style="color:#7d8899;margin-left:8px">删</a></span></div>');
  }
  const tot='<div class="lbl" style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px">合计浮动盈亏 '+(total>=0?'+':'')+total.toFixed(0)+' 元</div>';
  box.innerHTML=lines.join('')+tot;
  box.querySelectorAll('[data-pdel]').forEach(a=>a.onclick=async(e)=>{ e.preventDefault(); await db.from('positions').delete().eq('id',a.dataset.pdel); renderPositions(); });
}
$('#addPos').onclick = async ()=>{
  const code=($('#pcode').value||'').trim(), cost=Number($('#pcost').value), qty=Number($('#pqty').value);
  if(!/^\d{6}$/.test(code)){ alert('代码要 6 位数字'); return; }
  if(!(cost>0) || !(qty>0)){ alert('成本价和股数都要填正数'); return; }
  $('#addPos').disabled=true;
  try{
    let name=null;
    try{ const q=await emQuote(code); name=q.name; }catch(e){}
    await db.from('positions').insert({ code, name, avg_cost:cost, qty });
    $('#pcode').value=''; $('#pcost').value=''; $('#pqty').value='';
    await renderPositions();
  }catch(e){ alert('保存失败：'+(e.message||e)); }

};

// ---------- 主动汇报：每日简报 ----------
let briefRow=null;
function todayStart(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString(); }
async function loadBrief(){
  try{
    const { data } = await db.from('reports').select('*').eq('kind','brief').gte('created_at', todayStart()).order('id',{ascending:false}).limit(1);
    const row=(data && data[0]) || null;
    if(row && /看不到实时行情|行情这次没取到|暂时没法帮你盯/.test(String(row.body||''))) return null;
    return row;
  }catch(e){ return null; }
}
async function makeBrief(){
  const now=new Date();
  const ds=now.toLocaleDateString('zh-CN',{year:'numeric',month:'numeric',day:'numeric'});
  const t=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  let facts='';
  const { data:wl } = await db.from('watchlist').select('*').order('created_at',{ascending:false}).limit(6);
  if(wl && wl.length){
    const lines=[];
    for(const w of wl){
      try{
        const q=await callFn({action:'quote',code:w.code});
        if(!q||q.price==null) continue;
        lines.push('- '+(q.name||w.name)+'('+q.code+')：最新 '+q.price+' 元，涨跌 '+(q.chgPct==null?'-':(q.chgPct>=0?'+':'')+q.chgPct.toFixed(2)+'%')+(q.turnover==null?'':'，换手 '+q.turnover.toFixed(2)+'%')+(q.marketTime?'，行情时间 '+q.marketTime:''));
      }catch(e){}
    }
    facts = lines.length ? ('时间 '+ds+' '+t+'。用户自选股实时快照：\n'+lines.join('\n')) : ('时间 '+ds+' '+t+'。用户还没有自选股；行情服务正常可用。');
  }else{
    facts = '时间 '+ds+' '+t+'。用户还没加任何自选股；行情服务正常可用。';
  }
  try{
    const pos = await loadPositions();
    const pl=[]; let total=0;
    for(const p of pos.slice(0,6)){
      if(!(Number(p.qty)>0) || !(Number(p.avg_cost)>0)) continue;
      try{
        const q=await callFn({action:'quote',code:p.code});
        if(!q||q.price==null) continue;
        const cost=Number(p.avg_cost), qty=Number(p.qty);
        const pnl=(q.price-cost)*qty, rate=(q.price/cost-1)*100; total+=pnl;
        pl.push('- '+(q.name||p.name||p.code)+'('+p.code+')：成本 '+cost.toFixed(2)+'，现价 '+q.price+'，持股 '+qty+'，浮动盈亏 '+(pnl>=0?'+':'')+pnl.toFixed(0)+' 元（'+(rate>=0?'+':'')+rate.toFixed(2)+'%）'+(q.marketTime?'，行情时间 '+q.marketTime:''));
      }catch(e){}
    }
    if(pl.length) facts += '\n用户持仓：\n'+pl.join('\n')+'\n持仓合计浮动盈亏 '+(total>=0?'+':'')+total.toFixed(0)+' 元';
  }catch(e){}
  const sys = SYS_PROMPT + '\n现在你在主动给用户做一次当日简短汇报：第一句给结论（今天该注意什么），中间给依据，最后一句提醒；最多四句；只能用下面给出的数字，不许补任何新数字；不要列表、不要标题。即使没有自选股，也不要说“看不到实时行情”，只说明还没加自选股即可。';
  const r = await fetch(AI_URL,{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({ model:MODEL, stream:false, messages:[{role:'system',content:sys},{role:'user',content:facts}] }) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((j&&j.message)||('HTTP '+r.status));
  let text = ((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'').trim();
  if(!text) text = facts;
  const row={ kind:'brief', title:'今日简报 · '+ds, body:text };
  try{
    const { data:ins, error } = await db.from('reports').insert(row).select();
    if(!error && ins && ins[0]) return ins[0];
  }catch(e){}
  return row;
}
async function initBrief(force){
  if(!force) briefRow = await loadBrief();
  if(!briefRow){
    try{ briefRow = await makeBrief(); }catch(e){ console.warn('brief fail',e); }
  }
  updateBell();
  if(curSess && curSess.title===MAIN_TITLE) await loadMessages();
}
function updateBell(){
  const b=$('#bell'); if(!b) return;
  b.innerHTML = '🔔' + ((briefRow && !briefRow.read) ? '<span class="dot"></span>' : '');
}
async function renderBriefTop(){
  if(!curSess || curSess.title!==MAIN_TITLE || !briefRow) return false;
  const box=$('#msgs'); if(!box) return false;
  const wasUnread = !briefRow.read;
  const d=document.createElement('div'); d.className='msg brief';
  d.innerHTML='<h4><span>'+esc(briefRow.title||'今日简报')+'</span><span style="font-weight:400;color:#8b98a9">'+
    esc(new Date(briefRow.created_at||Date.now()).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}))+'</span></h4>'+
    '<div class="bd">'+esc(briefRow.body)+'</div>';
  const act=document.createElement('div'); act.className='act';
  const b1=document.createElement('button'); b1.className='ghost sm'; b1.textContent='🔊 念一遍'; b1.onclick=()=>speak(briefRow.body,b1);
  const b2=document.createElement('button'); b2.className='ghost sm'; b2.textContent='展开说说'; b2.onclick=()=>{ $('#inp').value='把今天这个简报展开说清楚点，我该注意什么？'; $('#inp').focus(); };
  act.appendChild(b1); act.appendChild(b2); d.appendChild(act);
  box.insertBefore(d, box.firstChild);
  if(wasUnread){
    briefRow.read=true; updateBell();
    try{ await db.from('reports').update({read:true}).eq('id',briefRow.id); }catch(e){}
  }
  return wasUnread;
}
$('#bell').onclick = async ()=>{
  if(!briefRow){ $('#stat').textContent='生成中…'; try{ await initBrief(false); }catch(e){} $('#stat').textContent='在线'; }
  if(curSess && curSess.title!==MAIN_TITLE && mainSess) await selectSession(mainSess);
  $('#msgs').scrollTop=0;
};

/* --- PWA：安装到桌面 + 离线外壳 --- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
let deferredPrompt = null;
const pwaStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pwaIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  if (!pwaStandalone()) $('#installBtn').classList.remove('hide');
});
if (pwaIOS && !pwaStandalone()) $('#installBtn').classList.remove('hide');
$('#installBtn').onclick = async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (r.outcome === 'accepted') $('#installBtn').classList.add('hide');
  } else if (pwaIOS) {
    alert('iPhone 安装：Safari 底部「分享」→「添加到主屏幕」→ 添加');
  } else {
    alert('浏览器菜单里选「安装应用」或「添加到主屏幕」');
  }
};
window.addEventListener('appinstalled', () => $('#installBtn').classList.add('hide'));
