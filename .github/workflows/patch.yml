name: patch-index
on:
  push:
    branches: [deploy]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy
      - name: Patch
        run: |
          set +e
          python3 .github/scripts/patch.py > .github/scripts/patch.log 2>&1
          cat .github/scripts/patch.log
          grep -c dedupeAnswer site/index.html >> .github/scripts/patch.log 2>&1 || true
      - name: Commit
        run: |
          git config user.name "export-bot"
          git config user.email "export@users.noreply.github.com"
          git add site/index.html .github/scripts/patch.log
          git commit -m "fix: dedupe + quote status + history" || true
          git push origin deploy
