name: patch-index
on:
  push:
    branches: [deploy]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy
      - name: Patch
        run: |
          python3 .github/scripts/patch.py
          node --check <(python3 - <<'PY'
import re
s=open('site/index.html',encoding='utf-8').read()
print('\n'.join(re.findall(r'<script(?![^>]*src=)[^>]*>([\s\S]*?)</script>',s)))
PY
          ) || true
          grep -c dedupeAnswer site/index.html
      - name: Commit
        run: |
          git config user.name "export-bot"
          git config user.email "export@users.noreply.github.com"
          git add site/index.html
          git commit -m "fix: dedupe + quote status + history" || true
          git push origin deploy
