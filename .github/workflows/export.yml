name: export-astock
on:
  push:
    branches: [export]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: export
      - name: Mirror live site
        run: |
          mkdir -p site
          BASE=https://xiaoman-astock.vercel.app
          for f in index.html install.html manifest.json sw.js iam-l2.js download/astock.apk; do
            mkdir -p site/$(dirname $f)
            curl -L --retry 6 --retry-delay 5 --max-time 180 -fsS "$BASE/$f" -o "site/$f" || echo "FAIL $f"
          done
          for i in 96 180 192 512 1024; do
            curl -L --retry 3 --max-time 60 -fsS "$BASE/icons/icon-$i.png?v=3" -o "site/icons/icon-$i.png" || true
          done
          for f in logo-full.png icon-512-maskable.png icon-384.png icon-152.png icon-144.png icon-72.png icon-48.png favicon.ico apple-touch-icon.png; do
            curl -L --retry 3 --max-time 60 -fsS "$BASE/icons/$f" -o "site/icons/$f" || true
          done
          find site -type f -printf '%p %s bytes\n' | sort
      - name: Commit snapshot
        run: |
          git config user.name "export-bot"
          git config user.email "export@users.noreply.github.com"
          git add site
          git commit -m "snapshot: live site" || true
          git push origin export
